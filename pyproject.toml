[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redacta"
version = "0.1.0"
description = "Versioned privacy transformations and revocable dataset releases"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
redacta = "redacta.cli:main"

# Explicit package layout; no flat-layout auto-discovery, no namespace
# packages. sdist contents are pinned separately by MANIFEST.in and the
# release gate's source-manifest.json allowlist.
[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["redacta"]
namespaces = false
